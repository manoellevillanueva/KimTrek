    <main class="payment-main">
        <div class="payment-panel">
            <h1>Edit Account</h1>
            <label for="Name">Name</label>
            <input type="text" id="Name" value="John Doe" />
            
            <label for="Email">Email</label>
            <input type="email" id="Email" value="johndoe@example.com" />
            
            <label for="Phone">Phone Number</label>
            <input type="tel" id="Phone" value="+1 234 567 890" />
            
            <label for="Address">Address</label>
            <input type="text" id="Address" value="123 Traveler Street, Wander City" />
            
            <label for="Password">New Password</label>
            <input type="password" id="Password" placeholder="Enter new password" />
            
            <label for="ConfirmPassword">Confirm Password</label>
            <input type="password" id="ConfirmPassword" placeholder="Confirm new password" />
            
            <div class="payment-button-container">
                <button class="payment-button">Save Changes</button>
            </div>
        </div>
    </main>
